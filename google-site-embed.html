  <style>
    /* Estilo da Folha de Currículo (Preview) */
    .resume-paper {
      font-family: 'Montserrat', sans-serif;
      color: #1a1a1a;
      background: white;
      line-height: 1.4;
      width: 210mm;
      min-height: 297mm;
      padding: 15mm 20mm;

      text-align: left;
    }
    
    .resume-paper h1 { font-size: 22pt; font-weight: bold; margin-bottom: 2pt; color: #000; text-transform: uppercase; }
    .resume-paper h2 { font-size: 12pt; font-weight: bold; border-bottom: 1.5pt solid #333; margin-top: 14pt; margin-bottom: 6pt; padding-bottom: 2pt; color: #000; }
    .resume-paper h3 { font-size: 11pt; font-weight: bold; margin-bottom: 1pt; }

    .resume-paper .contact-info { font-size: 9pt; margin-bottom: 10pt; color: #555; display: flex; flex-wrap: wrap; gap: 8px; border-bottom: 1px solid #eee; padding-bottom: 8px;}
    
    .page-break-avoid { page-break-inside: avoid; }

    /* Custom scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #ffffff; }

  <!-- React & Babel CDN -->

</head>
<body class="bg-gray-50 min-h-screen text-black">

  <div id="root"></div>

  <!-- React Code with Babel -->
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const BRAZILIAN_STATES = [
      "AC", "AL", "AP", "AM", "BA", "CE", "DF", "ES", "GO", "MA", "MT", "MS", "MG", 
      "PA", "PB", "PR", "PE", "PI", "RJ", "RN", "RS", "RO", "RR", "SC", "SP", "SE", "TO"
    ];

    const COMMON_HARD_SKILLS = [
      "Microsoft Excel", "Pacote Office", "Digitação", "Atendimento ao Cliente", 
      "Organização de Arquivos", "Metodologia 5S", "Leitura de Desenho Técnico"
    ];

    const COMMON_SOFT_SKILLS = [
      "Trabalho em Equipe", "Comunicação Eficaz", "Pontualidade", "Proatividade", 
      "Organização", "Resolução de Problemas", "Atenção aos Detalhes", "Adaptabilidade"
    ];

    // Inline SVG Icons mapped to replace Lucide
    const Icons = {
      User: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>,
      GraduationCap: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" /></svg>,
      Briefcase: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
      Trophy: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.172 16.172a4 4 0 015.656 0M9 10h.01M15 10h.01M12 12h.01M12 12a2 2 0 100-4 2 2 0 000 4z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Car: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
      Languages: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M14.7 17h5.6M4.5 9c1.67 4.14 4.54 7.42 8 9.5" /></svg>,
      Chat: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" /></svg>,
      Zap: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>,
      CheckCircle: () => <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Trash: () => <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>,
      Plus: () => <svg className="w-4 h-4 inline" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 6v6m0 0v6m0-6h6m-6 0H6" /></svg>,
      Sparkles: () => <svg className="w-3.5 h-3.5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" /></svg>,
      Download: () => <svg className="w-4 h-4 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>,
      Send: () => <svg className="w-4 h-4 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8" /></svg>,
      MapPin: () => <svg className="w-2.5 h-2.5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M15 11a3 3 0 11-6 0 3 3 0 016 0z" /></svg>,
      Phone: () => <svg className="w-2.5 h-2.5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 5a2 2 0 012-2h3.28a1 1 0 01.94.725l.548 2.2a1 1 0 01-.321.988l-1.305.98a10.582 10.582 0 004.872 4.872l.98-1.305a1 1 0 01.988-.321l2.2.548a1 1 0 01.725.94V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z" /></svg>,
      Mail: () => <svg className="w-2.5 h-2.5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
      Link: () => <svg className="w-2.5 h-2.5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M14.828 14.828a4 4 0 015.656 0l4 4a4 4 0 01-5.656 5.656l-1.1-1.1" /></svg>,
      Monitor: () => <svg className="w-2.5 h-2.5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" /></svg>,
      Info: ({ className = "w-4 h-4" }) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>,
      Copy: () => <svg className="w-3.5 h-3.5 inline mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" /></svg>,
      Check: () => <svg className="w-3.5 h-3.5 inline mr-1 text-green-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M5 13l4 4L19 7" /></svg>
    };

    function App() {
      const [step, setStep] = useState(0);
      const [xp, setXp] = useState(0);
      const [isGenerating, setIsGenerating] = useState(false);
      const [isGeneratingHard, setIsGeneratingHard] = useState(false);
      const [isGeneratingSoft, setIsGeneratingSoft] = useState(false);
      const [isGeneratingExp, setIsGeneratingExp] = useState({});
      
      const [suggestedHardSkills, setSuggestedHardSkills] = useState([]);
      const [suggestedSoftSkills, setSuggestedSoftSkills] = useState([]);
      const [suggestedActivities, setSuggestedActivities] = useState({});
      
      // LocalStorage configurations for Gemini API Key
      const [apiKey, setApiKey] = useState(() => localStorage.getItem('GEMINI_API_KEY') || '');
      const [showConfig, setShowConfig] = useState(false);
      const [copiedPrompt, setCopiedPrompt] = useState(false);

      const maxSteps = 9;

      const [data, setData] = useState({
        fullName: "",
        city: "",
        state: "",
        phone: "",
        email: "",
        linkedin: "",
        portfolio: "",
        summary: "",
        education: [{ school: "", course: "", level: "", period: "", details: "" }],
        experience: [{ company: "", role: "", period: "", description: "" }],
        hardSkills: "",
        softSkills: "",
        driverLicense: "",
        languages: "",
        courses: [{ institution: "", title: "", year: "", duration: "" }]
      });

      const previewContainerRef = useRef(null);
      const [previewScale, setPreviewScale] = useState(1);

      useEffect(() => {
        const updateScale = () => {
          if (previewContainerRef.current) {
            const containerWidth = previewContainerRef.current.clientWidth;
            const padding = window.innerWidth >= 1024 ? 80 : 32;
            const availableWidth = containerWidth - padding;
            const targetWidth = 794; 
            const newScale = Math.max(0.3, Math.min(availableWidth / targetWidth, 1));
            setPreviewScale(newScale);
          }
        };

        const observer = new ResizeObserver(updateScale);
        if (previewContainerRef.current) observer.observe(previewContainerRef.current);
        updateScale();

        return () => observer.disconnect();
      }, []);

      useEffect(() => {
        const progress = Math.round((step / maxSteps) * 100);
        setXp(progress);
      }, [step]);

      const handleChange = (field, value) => {
        setData(prev => ({ ...prev, [field]: value }));
      };

      const handleEducationChange = (index, field, value) => {
        const newList = [...data.education];
        newList[index] = { ...newList[index], [field]: value };
        setData(prev => ({ ...prev, education: newList }));
      };

      const addEducation = () => {
        setData(prev => ({
          ...prev,
          education: [...prev.education, { school: "", course: "", level: "", period: "", details: "" }]
        }));
      };

      const removeEducation = (index) => {
        if (data.education.length === 1) return;
        setData(prev => ({
          ...prev,
          education: prev.education.filter((_, i) => i !== index)
        }));
      };

      const handleExperienceChange = (index, field, value) => {
        const newList = [...data.experience];
        newList[index] = { ...newList[index], [field]: value };
        setData(prev => ({ ...prev, experience: newList }));
      };

      const addExperience = () => {
        setData(prev => ({
          ...prev,
          experience: [...prev.experience, { company: "", role: "", period: "", description: "" }]
        }));
      };

      const removeExperience = (index) => {
        if (data.experience.length === 1) return;
        setData(prev => ({
          ...prev,
          experience: prev.experience.filter((_, i) => i !== index)
        }));
      };

      const handleEventChange = (index, field, value) => {
        const newList = [...data.courses];
        newList[index] = { ...newList[index], [field]: value };
        setData(prev => ({ ...prev, courses: newList }));
      };

      const addEvent = () => {
        setData(prev => ({
          ...prev,
          courses: [...prev.courses, { institution: "", title: "", year: "", duration: "" }]
        }));
      };

      const removeEvent = (index) => {
        if (data.courses.length === 1) return;
        setData(prev => ({
          ...prev,
          courses: prev.courses.filter((_, i) => i !== index)
        }));
      };

      const saveApiKey = (key) => {
        setApiKey(key);
        localStorage.setItem('GEMINI_API_KEY', key);
        setShowConfig(false);
      };

      const callGemini = async (prompt, isJson = false) => {
        if (!apiKey) {
          alert("Por favor, configure sua Chave API do Gemini clicando no ícone de engrenagem no topo para usar recursos de IA.");
          setShowConfig(true);
          throw new Error("Missing API Key");
        }

        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        
        const payload = {
          contents: [{ parts: [{ text: prompt }] }]
        };

        if (isJson) {
          payload.generationConfig = {
            responseMimeType: "application/json"
          };
        }

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!response.ok) {
          const err = await response.json();
          throw new Error(err.error?.message || "Erro na API do Gemini");
        }

        const result = await response.json();
        return result.candidates?.[0]?.content?.parts?.[0]?.text;
      };

      const downloadPDF = () => {
        const element = document.getElementById('resume-preview');
        if (!element) return;
        
        const opt = {
          margin: 0,
          filename: `Curriculo_${data.fullName || 'Export'}.pdf`,
          image: { type: 'jpeg', quality: 0.98 },
          html2canvas: { scale: 2, useCORS: true },
          jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
        };
        html2pdf().set(opt).from(element).save();
      };

      const downloadDOC = () => {
        const element = document.getElementById('resume-preview');
        if (!element) return;

        const header = "<html xmlns:o='urn:schemas-microsoft-com:office:office' "+
                "xmlns:w='urn:schemas-microsoft-com:office:word' "+
                "xmlns='http://www.w3.org/TR/REC-html40'>"+
                "<head><meta charset='utf-8'><title>Currículo</title>"+
                "<style>"+
                "body { font-family: Arial, sans-serif; line-height: 1.5; color: #333; }"+
                "h1 { color: #E30613; text-transform: uppercase; border-bottom: 2px solid #E30613; padding-bottom: 5px; }"+
                "h2 { color: #E30613; font-size: 14pt; border-bottom: 1px solid #ccc; margin-top: 20px; }"+
                "h3 { font-size: 12pt; margin-bottom: 5px; }"+
                ".contact-info { font-size: 10pt; margin-bottom: 20px; }"+
                "section { margin-bottom: 15px; }"+
                "p { margin: 5px 0; }"+
                "</style>"+
                "</head><body>";
        const footer = "</body></html>";
        
        const sourceHTML = header + element.innerHTML + footer;
        
        const blob = new Blob(['\ufeff', sourceHTML], { type: 'application/msword' });
        const url = URL.createObjectURL(blob);
        const fileDownload = document.createElement("a");
        document.body.appendChild(fileDownload);
        fileDownload.href = url;
        fileDownload.download = `Curriculo_${data.fullName || 'Export'}.doc`;
        fileDownload.click();
        document.body.removeChild(fileDownload);
        URL.revokeObjectURL(url);
      };

      const sendToLibrary = () => {
        downloadDOC();
        
        const subject = encodeURIComponent(`Currículo Turbinado - ${data.fullName || 'Candidato'}`);
        const body = encodeURIComponent(`Olá equipe da Biblioteca SENAI-SP 9.14,\n\nEstou enviando meu currículo turbinado em anexo para os últimos retoques.\n\n(O arquivo foi baixado automaticamente em seu computador. Por favor, anexe-o a este e-mail).\n\nAtenciosamente,\n${data.fullName || 'Candidato'}`);
        
        const cc = data.email ? `&cc=${data.email}` : '';
        
        setTimeout(() => {
          window.location.href = `mailto:morgan.morgado@sp.senai.br?subject=${subject}&body=${body}${cc}`;
        }, 500);
      };

      const generateAISummary = async () => {
        if (!data.fullName && !data.hardSkills) {
          alert("Por favor, preencha pelo menos seu nome e competências para gerar um resumo melhor.");
          return;
        }
        
        setIsGenerating(true);
        try {
          const prompt = `Aja como um especialista em recrutamento e seleção. Escreva um resumo profissional/mini bio de no máximo 300 palavras no currículo que está sendo visualizado. 
          Use linguagem direta, verbos de ação e garanta que seja otimizado para ATS (rastreadores de currículo). Foque nas competências do candidato.
          
          Dados do Candidato:
          Nome: ${data.fullName}
          Educação: ${data.education.map(edu => `${edu.course} na ${edu.school} (${edu.period})`).join(', ')}
          Experiência: ${data.experience.map(exp => `${exp.role} na ${exp.company} - ${exp.description}`).join('; ')}
          Hard Skills: ${data.hardSkills}
          Soft Skills: ${data.softSkills}
          Cursos: ${data.courses.map(c => `${c.title} na ${c.institution} (${c.year})`).join(', ')}`;

          const text = await callGemini(prompt);
          if (text) {
            setData(prev => ({ ...prev, summary: text.trim() }));
          }
        } catch (error) {
          console.error("Erro ao gerar resumo:", error);
        } finally {
          setIsGenerating(false);
        }
      };

      const generateSkills = async (type) => {
        const courses = data.education.map(edu => edu.course).filter(c => c).join(", ");
        if (!courses) {
          alert("Por favor, preencha o campo 'Curso' na tela de Experiências Escolares primeiro.");
          return;
        }

        if (type === 'hard') setIsGeneratingHard(true);
        else setIsGeneratingSoft(true);

        try {
          const prompt = `Gere uma lista de ${type === 'hard' ? 'habilidade técnica (hard skills)' : 'habilidades comportamentais (soft skills)'} importantes para quem estuda ou se formou em: ${courses}. 
          Retorne obrigatoriamente no formato de JSON, assim:
          {
            "skills": ["habilidade 1", "habilidade 2", "habilidade 3", "habilidade 4", "habilidade 5", "habilidade 6", "habilidade 7", "habilidade 8"]
          }
          Não retorne nada além do JSON válido, não inclua tags markdown de bloco.`;

          const responseText = await callGemini(prompt, true);
          const result = JSON.parse(responseText);
          if (result && result.skills) {
            if (type === 'hard') setSuggestedHardSkills(result.skills);
            else setSuggestedSoftSkills(result.skills);
          }
        } catch (error) {
          console.error(`Erro ao gerar ${type} skills:`, error);
        } finally {
          if (type === 'hard') setIsGeneratingHard(false);
          else setIsGeneratingSoft(false);
        }
      };

      const addSkill = (type, skill) => {
        const field = type === 'hard' ? 'hardSkills' : 'softSkills';
        const current = data[field];
        if (current.toLowerCase().includes(skill.toLowerCase())) return;
        const newValue = current ? `${current}, ${skill}` : skill;
        setData(prev => ({ ...prev, [field]: newValue }));
      };

      const removeSkill = (type, skill) => {
        const field = type === 'hard' ? 'hardSkills' : 'softSkills';
        const current = data[field];
        const list = current.split(',').map(s => s.trim()).filter(s => s && s.toLowerCase() !== skill.toLowerCase());
        setData(prev => ({ ...prev, [field]: list.join(', ') }));
      };

      const generateExpActivities = async (index) => {
        const role = data.experience[index].role;
        if (!role) {
          alert("Por favor, preencha o campo 'Cargo' primeiro.");
          return;
        }

        setIsGeneratingExp(prev => ({ ...prev, [index]: true }));

        try {
          const prompt = `Retorne uma lista com 6 atividades curtas e muito profissionais em formato de tópicos para descrever o cargo de de: ${role}.
          Retorne obrigatoriamente em formato de JSON:
          {

                  <strong>Por que informar a CNH?</strong> Diversas vagas exigem disponibilidade para locomoção, viagens ou trabalho externo. Indicar suas categorias demonstra prontidão profissional.
                </p>
              </div>
            </div>
          )
        },
        {
          title: "Idiomas",
          subtitle: "Línguas e nível de proficiência",
          icon: <Icons.Languages />,
          content: (
            <div className="space-y-6">
              <div className="space-y-3">
                <label className="text-sm font-bold text-black block uppercase">Selecione ou adicione idiomas *</label>
                
                {/* Opções rápidas */}
                <div className="space-y-2">
                  <span className="text-[11px] font-bold text-brand-gray uppercase">Opções rápidas recomendadas:</span>
                  <div className="flex flex-wrap gap-1.5">
                    {[
                      "Português (Nativo)",
                      "Inglês (Básico)",
                      "Inglês (Intermediário)",
                      "Inglês (Avançado)",
                      "Inglês (Fluente)",
                      "Espanhol (Básico)",
                      "Espanhol (Intermediário)",
                      "Espanhol (Avançado)",
                      "Libras (Básico)",
                      "Libras (Intermediário)",
                      "Francês (Básico)",
                      "Italiano (Básico)",
                      "Alemão (Básico)",
                      "Japonês (Básico)"
                    ].map((item) => (
                      <button
                        key={item}
                        type="button"
                        onClick={() => {
                          const current = data.languages ? data.languages.split(', ') : [];
                          if (!current.includes(item)) {
                            handleChange('languages', [...current, item].join(', '));
                          }
                        }}
                        className="text-xs bg-white border border-brand-gray/40 hover:border-brand-red hover:text-brand-red hover:bg-brand-red/5 px-2 py-1 rounded transition-all text-gray-700"
                      >
                        + {item}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Dropdown seletor */}
                <div className="pt-2">
                  <label className="text-[11px] font-bold text-brand-gray uppercase block mb-1">Ou selecione na lista:</label>
                  <select 
                    className="w-full bg-white border border-brand-gray rounded p-2 focus:border-brand-red outline-none transition-colors text-black text-sm"
                    onChange={(e) => {
                      if (e.target.value) {
                        const current = data.languages ? data.languages.split(', ') : [];
                        if (!current.includes(e.target.value)) {
                          handleChange('languages', [...current, e.target.value].join(', '));
                        }
                        e.target.value = "";
                      }
                    }}
                  >
                    <option value="">Selecione um idioma e nível *</option>
                    <option value="Português (Nativo)">Português (Nativo)</option>
                    <option value="Inglês (Básico)">Inglês (Básico)</option>
                    <option value="Inglês (Intermediário)">Inglês (Intermediário)</option>
                    <option value="Inglês (Avançado)">Inglês (Avançado)</option>
                    <option value="Inglês (Fluente)">Inglês (Fluente)</option>
                    <option value="Espanhol (Básico)">Espanhol (Básico)</option>
                    <option value="Espanhol (Intermediário)">Espanhol (Intermediário)</option>
                    <option value="Espanhol (Avançado)">Espanhol (Avançado)</option>
                    <option value="Libras (Básico)">Libras (Língua Brasileira de Sinais - Básico)</option>
                    <option value="Libras (Intermediário)">Libras (Língua Brasileira de Sinais - Intermediário)</option>
                    <option value="Francês (Básico)">Francês (Básico)</option>
                    <option value="Francês (Intermediário)">Francês (Intermediário)</option>
                    <option value="Italiano (Básico)">Italiano (Básico)</option>
                    <option value="Italiano (Intermediário)">Italiano (Intermediário)</option>
                    <option value="Alemão (Básico)">Alemão (Básico)</option>
                    <option value="Japonês (Básico)">Japonês (Básico)</option>
                    <option value="Mandarim (Básico)">Mandarim (Básico)</option>
                  </select>
                </div>

                {/* Adição manual */}
                <div className="pt-1">
                  <label className="text-[11px] font-bold text-brand-gray uppercase block mb-1">Adicionar outro idioma manualmente:</label>
                  <div className="flex gap-2">
                    <input 
                      type="text" 
                      id="otherLanguageInput"
                      className="flex-1 bg-white border border-brand-gray rounded p-2 focus:border-brand-red outline-none transition-colors text-black text-sm" 
                      placeholder="Ex: Mandarim (Básico), Russo... *" 
                      onKeyDown={(e) => {
                        if (e.key === 'Enter') {
                          e.preventDefault();
                          const val = e.target.value.trim();
                          if (val) {
                            const current = data.languages ? data.languages.split(', ') : [];
                            if (!current.includes(val)) {
                              handleChange('languages', [...current, val].join(', '));
                            }
                            e.target.value = "";
                          }
                        }
                      }}
                    />
                    <button 
                      type="button"
                      onClick={() => {
                        const input = document.getElementById('otherLanguageInput');
                        const val = input.value.trim();
                        if (val) {
                          const current = data.languages ? data.languages.split(', ') : [];
                          if (!current.includes(val)) {
                            handleChange('languages', [...current, val].join(', '));
                          }
                          input.value = "";
                        }
                      }}
                      className="bg-brand-red hover:bg-brand-dark-red text-white font-bold px-4 rounded transition-colors text-xs"
                    >
                      Adicionar
                    </button>
                  </div>
                </div>

                {/* Idiomas adicionados */}
                <div className="pt-2">
                  <span className="text-xs font-bold text-black uppercase block mb-2">Idiomas que constarão no currículo:</span>
                  {data.languages ? (
                    <div className="p-2 border rounded border-gray-200 flex flex-wrap gap-1.5 text-xs bg-white">
                      {data.languages.split(', ').map(lang => (
                        <span key={lang} className="bg-brand-red/10 border border-brand-red/30 px-2.5 py-1 rounded text-brand-red flex items-center gap-1 font-medium">
                          {lang}
                          <button 
                            type="button"
                            onClick={() => {
                              const current = data.languages.split(', ').filter(l => l !== lang).join(', ');
                              handleChange('languages', current);
                            }}
                            className="font-bold ml-1 hover:text-brand-dark-red"
                            title="Remover idioma"
                          >
                            ×
                          </button>
                        </span>
                      ))}
                    </div>
                  ) : (
                    <p className="text-xs text-brand-gray italic bg-gray-50 p-2.5 rounded-lg border border-gray-200">
                      Nenhum idioma selecionado ainda. Clique nas opções rápidas acima, selecione na lista ou digite manualmente.
                    </p>
                  )}
                </div>

                <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-xs mt-4">
                  <p className="leading-relaxed">
                    <strong>Dica de ouro:</strong> Se você só domina o português, adicione <em>"Português (Nativo)"</em>. Se conhece a <strong>Libras (Língua Brasileira de Sinais)</strong>, não deixe de registrar, pois é um excelente diferencial de inclusão valorizado pelas empresas!
                  </p>
                </div>
              </div>
            </div>
          )
        },
        {
          title: "Fale um pouco sobre você",
          subtitle: "O que você faz e qual seu objetivo?",
          icon: <Icons.Chat />,
          content: (
            <div className="space-y-4">
              <div className="flex justify-between items-center">
                <label className="text-xs font-bold text-black uppercase">Resumo Profissional *</label>
              </div>
              <textarea 
                className="w-full h-36 bg-white border border-brand-red rounded p-3 focus:border-brand-dark-red outline-none transition-colors resize-none text-black text-sm" 
                placeholder="Ex: Estudante de TI com foco em desenvolvimento web. Busco minha primeira oportunidade... *" 
                value={data.summary} 
                onChange={e => handleChange('summary', e.target.value)} 
              />

              {/* Quadro azul com Dica de Prompt para IA Generativa */}
              <div className="p-4 bg-blue-50 border border-blue-200 rounded-xl text-blue-900 space-y-2.5">
                <div className="space-y-1">
                  <p className="font-bold text-xs text-blue-950 uppercase tracking-wide">Dica:</p>
                  <p className="text-xs text-blue-900 leading-relaxed">
                    Você pode usar a IA Generativa para fazer sua mini bio. Use a PROMPT abaixo:
                  </p>
                </div>

                <div className="bg-white/95 border border-blue-300 rounded-lg p-3 text-xs font-mono text-blue-950 leading-relaxed select-all relative group shadow-xs">
                  <p className="pr-16 font-medium">
                    ANALISE ESTE CURRÍCULO COMO SE VOCÊ FOSSE UM RECRUTADOR DE UMA EMPRESA DE [ÁREA DA EMPRESA] PARA ESCOLHER UM CANDIDATO PARA A VAGA DE [NOME DA VAGA]. ADICIONE DICAS PARA MELHORAR O CURRÍCULO E ACRESCENTE MAIS PALAVRAS-CHAVE NA MINI BIO E SEÇÃO DE COMPETÊNCIAS.
                  </p>
                  <button
                    type="button"
                    onClick={() => {
                      const promptText = "ANALISE ESTE CURRÍCULO COMO SE VOCÊ FOSSE UM RECRUTADOR DE UMA EMPRESA DE [ÁREA DA EMPRESA] PARA ESCOLHER UM CANDIDATO PARA A VAGA DE [NOME DA VAGA]. ADICIONE DICAS PARA MELHORAR O CURRÍCULO E ACRESCENTE MAIS PALAVRAS-CHAVE NA MINI BIO E SEÇÃO DE COMPETÊNCIAS.";
                      navigator.clipboard.writeText(promptText);
                      setCopiedPrompt(true);
                      setTimeout(() => setCopiedPrompt(false), 2500);
                    }}
                    className="absolute top-2.5 right-2.5 bg-blue-100 hover:bg-blue-200 text-blue-800 text-[11px] font-sans font-bold px-2.5 py-1 rounded-md flex items-center gap-1 transition-colors border border-blue-300"
                    title="Copiar prompt"
                  >
                    {copiedPrompt ? (
                      <>
                        <Icons.Check /> Copiado!
                      </>
                    ) : (
                      <>
                        <Icons.Copy /> Copiar
                      </>
                    )}
                  </button>
                </div>
              </div>
            </div>
          )
        },
        {
          title: "Turbinamos seu currículo!",
          subtitle: "Quase lá! Falta pouco",
          icon: <Icons.CheckCircle />,
          content: (
            <div className="flex flex-col gap-6 items-center justify-center h-full py-4 text-center">
              <p className="text-sm font-medium text-black leading-relaxed">
                Agora que seu currículo está turbinado, envie para a Biblio SENAI-SP 9.14 para darmos os últimos retoques.
              </p>

              <button 
                onClick={downloadDOC} 
                className="w-full max-w-xs bg-white border-2 border-brand-red text-brand-red hover:bg-brand-red/5 font-bold py-3 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-sm"
              >
                <Icons.Download /> BAIXAR O EDITÁVEL (.DOC)
              </button>

              <div className="w-full max-w-xs h-px bg-brand-gray/20 my-2"></div>

              <button 
                onClick={sendToLibrary}
                className="w-full max-w-xs bg-brand-red hover:bg-brand-dark-red text-white font-bold py-4 rounded-lg flex items-center justify-center gap-2 transition-colors shadow-lg"
              >
                <Icons.Send /> Envie este currículo para a Biblioteca!
              </button>
              
              <div className="text-[11px] text-brand-gray text-left bg-brand-gray/5 p-3 rounded-lg border border-brand-gray/10 w-full max-w-xs">
                <p className="font-bold mb-1">Instruções:</p>
                <p>1 - Baixe o documento para seu dispositivo;</p>
                <p>2 - Envie por e-mail no botão acima;</p>
                <p>3 - Anexe o documento baixado;</p>
                <p>4 - Após envio, aguarde a devolutiva da nossa equipe com a formatação final.</p>
              </div>
            </div>
          )
        }
      ];

      return (
        <div className="flex flex-col lg:flex-row min-h-screen bg-white">
          
          {/* PAINEL ESQUERDO: Form */}
          <div className="w-full lg:w-2/5 p-6 bg-white border-r border-brand-gray flex flex-col shadow-2xl z-10">
            <header className="mb-8">
              <div className="flex justify-between items-center">
                <h1 className="font-bold text-brand-red text-xl flex items-center gap-2">
                  <span className="text-lg">⚡</span> TURBINE CURRÍCULO
                </h1>
                
                {/* Config bubble */}
                <button 
                  onClick={() => setShowConfig(!showConfig)}
                  className="bg-gray-100 hover:bg-gray-200 text-gray-700 p-2 rounded-full transition-colors relative"
                  title="Configurar IA"
                >
                  ⚙️
                </button>
              </div>

              {/* API Configuration Panel */}
              {showConfig && (
                <div className="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-xl space-y-3 shadow-inner">
                  <p className="text-xs font-semibold text-yellow-800">
                    Chave API do Gemini (Para recursos de IA)
                  </p>
                  <p className="text-[10px] text-yellow-700">
                    A chave é salva localmente e de forma totalmente segura no seu próprio navegador.
                  </p>
                  <div className="flex gap-2">
                    <input 
                      type="password" 
                      className="flex-1 bg-white border border-gray-300 rounded p-1.5 text-xs text-black"
                      placeholder="Cole sua chave AI Studio aqui..."
                      value={apiKey}
                      onChange={e => setApiKey(e.target.value)}
                    />
                    <button 
                      onClick={() => saveApiKey(apiKey)}
                      className="bg-yellow-600 text-white font-bold text-xs px-3 py-1 rounded hover:bg-yellow-700"
                    >
                      Gravar
                    </button>
                  </div>
                  <p className="text-[10px] text-yellow-600">
                    Não tem chave? Obtenha uma grátis em <a href="https://aistudio.google.com/" target="_blank" className="underline font-semibold">Google AI Studio</a>.
                  </p>
                </div>
              )}

              <div className="mt-6 w-full bg-brand-gray h-3 rounded-full overflow-hidden border">
                <div 
                  className="bg-brand-red h-full transition-all duration-300"
                  style={{ width: `${xp}%` }}
                />
              </div>
              <div className="flex justify-between mt-2 text-[10px] uppercase font-bold text-brand-gray tracking-widest">
                <span>Progresso: {xp}%</span>
                <span>Etapa {step + 1} de {stepsData.length}</span>
              </div>

              <div className="flex justify-between items-center mt-6">
                <button 
                  onClick={() => setStep(s => s - 1)} 
                  disabled={step === 0} 
                  className={`px-4 py-2 rounded-lg font-bold text-xs transition-all ${step === 0 ? 'opacity-0 pointer-events-none' : 'bg-brand-gray hover:bg-brand-gray/80 text-white'}`}
                >
                  Anterior
                </button>
                
                {step < stepsData.length - 1 ? (
                  <button 
                    onClick={() => setStep(s => s + 1)} 
                    className="bg-brand-red hover:bg-brand-dark-red text-white px-5 py-2 rounded-lg font-bold text-xs shadow-md"
                  >
                    Próximo
                  </button>
                ) : (
                  <div className="w-[80px]" />
                )}
              </div>
            </header>

            <main className="space-y-6 flex-1">
              <div className="bg-brand-gray/10 border border-brand-gray p-6 rounded-2xl">
                <div className="flex items-center gap-4 mb-4">
                  <div className="p-3 bg-brand-red rounded-xl shadow-lg">
                    {stepsData[step].icon}
                  </div>
                  <div>
                    <h2 className="text-lg font-bold text-black">{stepsData[step].title}</h2>
                    <p className="text-brand-gray text-xs">{stepsData[step].subtitle}</p>
                  </div>
                </div>

                {step < stepsData.length - 1 && (
                  <div className="mb-5 p-3 bg-amber-50 border border-amber-200 rounded-xl text-amber-900 text-xs flex items-start gap-2 shadow-sm">
                    <span className="text-brand-red font-bold text-sm leading-none mt-0.5">*</span>
                    <p className="leading-relaxed font-medium">
                      Preencha todos os campos, é importante ter as informações completas para se ter um currículo profissional mais adequado e padronizado.
                    </p>
                  </div>
                )}

                {stepsData[step].content}
              </div>
            </main>

            <footer className="mt-8 pt-6 border-t border-brand-gray/20 text-[10px] text-brand-gray text-center leading-relaxed">
              Este é um aplicativo experimental do Google AI Studio em versão beta para o Projeto Engrenagens - 'Turbine meu currículo!' desenvolvido pela Biblioteca da Escola SENAI-SP 9.14 Presidente Prudente / contato: <a href="mailto:morgan.morgado@sp.senai.br" className="underline font-medium hover:text-brand-red">morgan.morgado@sp.senai.br</a>. Melhor visualizado em monitores desktop. 2023 - 2026.
            </footer>
          </div>

          {/* PAINEL DIREITO: Preview */}
          <div ref={previewContainerRef} className="w-full lg:w-3/5 bg-brand-gray/20 p-4 lg:p-10 overflow-y-auto flex justify-center items-start">
            <div className="sticky top-10">
              <div 
                id="resume-preview" 
                className="resume-paper shadow-2xl origin-top transition-transform"
                style={{ transform: `scale(${previewScale})` }}
              >
                <header className="page-break-avoid">
                  <h1>{data.fullName || "SEU NOME COMPLETO"}</h1>
                  <div className="contact-info">
                    {(data.city || data.state) && (
                      <span>
                        <Icons.MapPin /> {data.city}{data.city && data.state ? ' - ' : ''}{data.state}
                      </span>
                    )}
                    {data.phone && <span><Icons.Phone /> {data.phone}</span>}
                    {data.email && (
                      <span>
                        <Icons.Mail /> 
                        <a href={`mailto:${data.email}`} className="hover:underline">{data.email}</a>
                      </span>
                    )}
                    {data.linkedin && (
                      <span>
                        <Icons.Link /> 
                        <a href={data.linkedin.startsWith('http') ? data.linkedin : `https://${data.linkedin}`} target="_blank" className="hover:underline">
                          {data.linkedin.replace(/^https?:\/\/(www\.)?/, '')}
                        </a>
                      </span>
                    )}
                    {data.portfolio && (
                      <span>
                        <Icons.Monitor /> 
                        <a href={data.portfolio.startsWith('http') ? data.portfolio : `https://${data.portfolio}`} target="_blank" className="hover:underline">
                          {data.portfolio.replace(/^https?:\/\/(www\.)?/, '')}
                        </a>
                      </span>
                    )}
                  </div>
                </header>

                {data.summary && (
                  <section className="page-break-avoid">
                    <h2>RESUMO PROFISSIONAL</h2>
                    <p className="whitespace-pre-line">{data.summary}</p>
                  </section>
                )}

                {data.education.some(edu => edu.school) && (
                  <section className="page-break-avoid">
                    <h2>FORMAÇÃO ACADÊMICA</h2>
                    {data.education.map((edu, idx) => edu.school && (
                      <div key={idx} className={idx > 0 ? "mt-3" : ""}>
                        <h3>{edu.school}</h3>
                        <p>{edu.course} | {edu.period}</p>
                      </div>
                    ))}
                  </section>
                )}

                {data.experience.some(exp => exp.company) && (
                  <section className="page-break-avoid w-full">
                    <h2>EXPERIÊNCIAS PROFISSIONAIS</h2>
                    {data.experience.map((exp, idx) => exp.company && (
                      <div key={idx} className={idx > 0 ? "mt-4" : ""}>
                        <div className="flex justify-between items-baseline">
                          <h3>{exp.company}</h3>
                          <span className="text-xs text-brand-gray font-medium">{exp.period}</span>
                        </div>
                        <p className="font-semibold text-xs text-brand-red mb-1">{exp.role}</p>
                        <p className="whitespace-pre-line text-sm leading-relaxed">{exp.description}</p>
                      </div>
                    ))}
                  </section>
                )}

                {data.courses.some(c => c.title) && (
                  <section className="page-break-avoid">
                    <h2>EVENTOS E CERTIFICAÇÕES</h2>
                    {data.courses.map((item, idx) => item.title && (
                      <div key={idx} className={idx > 0 ? "mt-2" : ""}>
                        <h3>{item.title}</h3>
                        <p>{item.institution} | {item.year} {item.duration ? `(${item.duration})` : ''}</p>
                      </div>
                    ))}
                  </section>
                )}

                {(data.hardSkills || data.softSkills || data.driverLicense || data.languages) && (
                  <section className="page-break-avoid">
                    <h2>COMPETÊNCIAS E INFORMAÇÕES</h2>
                    {data.hardSkills && <p><strong>Técnicas:</strong> {data.hardSkills}</p>}
                    {data.softSkills && <p><strong>Comportamentais:</strong> {data.softSkills}</p>}
                    {data.driverLicense && data.driverLicense !== 'Não tenho habilitação' && <p><strong>Habilitação:</strong> {data.driverLicense}</p>}
                    {data.languages && <p><strong>Idiomas:</strong> {data.languages}</p>}
                  </section>
                )}
              </div>
            </div>
          </div>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
